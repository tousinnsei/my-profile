<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>内容管理后台 · 個人官网 CMS</title>
  <link rel="stylesheet" href="admin/admin.css" />
</head>
<body data-view="login">
  <!-- ============ 登录界面 ============ -->
  <section id="view-login" class="view view--login">
    <form class="login-card" id="login-form" autocomplete="off">
      <div class="login-card__brand">
        <span class="login-card__logo">❖</span>
        <h1>内容管理后台</h1>
        <p>個人官网 · 成果管理系统</p>
      </div>
      <label class="field">
        <span>管理员密码</span>
        <input type="password" id="login-password" placeholder="请输入管理密码" required />
      </label>
      <p class="login-card__error" id="login-error" hidden></p>
      <button class="btn btn--primary btn--block" type="submit" id="login-submit">登 录</button>
      <p class="login-card__hint">登录后可在左侧管理成果、动态、获奖与个人资料，并可一键发布到网站。</p>
    </form>
  </section>

  <!-- ============ 主界面 ============ -->
  <section id="view-main" class="view view--main" hidden>
    <aside class="sidebar">
      <div class="sidebar__brand">
        <span class="sidebar__logo">❖</span>
        <div><strong>内容管理后台</strong><small>個人官网 CMS</small></div>
      </div>
      <nav class="sidebar__nav">
        <button class="side-link is-active" data-view="projects"><span class="side-link__ic">◈</span>成果管理</button>
        <button class="side-link" data-view="updates"><span class="side-link__ic">✎</span>动态 / 新闻</button>
        <button class="side-link" data-view="awards"><span class="side-link__ic">★</span>获奖 / 荣誉</button>
        <button class="side-link" data-view="profile"><span class="side-link__ic">◉</span>个人资料</button>
      </nav>
      <div class="sidebar__actions">
        <button class="btn btn--ghost btn--block" id="export-btn">导出备份</button>
        <label class="btn btn--ghost btn--block" for="import-file">导入恢复</label>
        <input type="file" id="import-file" accept=".json" hidden />
      </div>
      <div class="sidebar__foot">
        <button class="btn btn--text" id="logout-btn">退出登录</button>
      </div>
    </aside>

    <main class="main">
      <!-- 顶部栏 -->
      <header class="topbar">
        <div class="topbar__title">
          <h2 id="view-title">成果管理</h2>
          <span class="topbar__status" id="save-status"></span>
        </div>
        <div class="topbar__actions">
          <button class="btn btn--ghost" id="save-draft-btn">保存草稿</button>
          <button class="btn btn--primary" id="publish-btn">发布到网站</button>
        </div>
      </header>

      <!-- 内容区 -->
      <div class="content">
        <!-- 成果管理 -->
        <div class="panel is-active" data-panel="projects">
          <div class="panel__toolbar">
            <div class="panel__toolbar-left">
              <div class="filter-tabs" id="projects-filter">
                <button class="filter-tab is-active" data-filter="all">全部</button>
                <button class="filter-tab" data-filter="research">研究课题</button>
                <button class="filter-tab" data-filter="company">创业企业</button>
                <button class="filter-tab" data-filter="system">开发系统</button>
                <button class="filter-tab" data-filter="paper">学术论文</button>
              </div>
            </div>
            <div class="panel__toolbar-right">
              <input class="search" type="search" id="projects-search" placeholder="搜索标题 / 简介（四语）…" />
              <select class="select" id="projects-sort">
                <option value="year-desc">按年份 ↓</option>
                <option value="year-asc">按年份 ↑</option>
                <option value="id">按编号</option>
              </select>
              <button class="btn btn--primary" id="projects-add">＋ 新增成果</button>
            </div>
          </div>
          <div class="count-hint" id="projects-count"></div>
          <div class="list" id="projects-list"></div>
          <div class="empty" id="projects-empty" hidden>没有符合条件的成果。</div>
        </div>

        <!-- 动态 -->
        <div class="panel" data-panel="updates">
          <div class="panel__toolbar">
            <div class="panel__toolbar-left">
              <div class="filter-tabs" id="updates-filter">
                <button class="filter-tab is-active" data-filter="all">全部</button>
                <button class="filter-tab" data-filter="published">已发布</button>
                <button class="filter-tab" data-filter="draft">草稿</button>
              </div>
            </div>
            <div class="panel__toolbar-right">
              <button class="btn btn--primary" id="updates-add">＋ 新增动态</button>
            </div>
          </div>
          <div class="list" id="updates-list"></div>
          <div class="empty" id="updates-empty" hidden>还没有动态。</div>
        </div>

        <!-- 获奖 -->
        <div class="panel" data-panel="awards">
          <div class="panel__toolbar">
            <div class="panel__toolbar-left">
              <div class="filter-tabs" id="awards-filter">
                <button class="filter-tab is-active" data-filter="all">全部</button>
                <button class="filter-tab" data-filter="published">已发布</button>
                <button class="filter-tab" data-filter="draft">草稿</button>
              </div>
            </div>
            <div class="panel__toolbar-right">
              <button class="btn btn--primary" id="awards-add">＋ 新增获奖</button>
            </div>
          </div>
          <div class="list" id="awards-list"></div>
          <div class="empty" id="awards-empty" hidden>还没有获奖记录。</div>
        </div>

        <!-- 个人资料 -->
        <div class="panel" data-panel="profile">
          <div class="profile-form" id="profile-form"></div>
        </div>
      </div>
    </main>
  </section>

  <!-- ============ 编辑抽屉 ============ -->
  <div class="drawer" id="drawer" hidden>
    <div class="drawer__mask"></div>
    <div class="drawer__panel">
      <header class="drawer__head">
        <h3 id="drawer-title">编辑</h3>
        <button class="drawer__close" id="drawer-close" aria-label="关闭">×</button>
      </header>
      <div class="drawer__body" id="drawer-body"></div>
      <footer class="drawer__foot">
        <button class="btn btn--ghost" id="drawer-cancel">取消</button>
        <span class="drawer__foot-spacer"></span>
        <button class="btn btn--ghost" id="drawer-save-draft">存为草稿</button>
        <button class="btn btn--primary" id="drawer-save">保存</button>
      </footer>
    </div>
  </div>

  <!-- ============ 预览弹窗 ============ -->
  <div class="modal-preview" id="modal-preview" hidden>
    <div class="modal-preview__mask"></div>
    <div class="modal-preview__box">
      <header class="modal-preview__head">
        <h3>发布预览</h3>
        <select class="select" id="preview-lang">
          <option value="zh">简体中文</option>
          <option value="ja">日本語</option>
          <option value="en">English</option>
          <option value="ko">한국어</option>
        </select>
        <button class="drawer__close" id="preview-close" aria-label="关闭">×</button>
      </header>
      <div class="modal-preview__body" id="preview-body"></div>
    </div>
  </div>

  <!-- ============ 发布确认弹窗 ============ -->
  <div class="modal-preview" id="modal-publish" hidden>
    <div class="modal-preview__mask"></div>
    <div class="modal-preview__box modal-preview__box--sm">
      <header class="modal-preview__head">
        <h3>发布到网站</h3>
        <button class="drawer__close" id="publish-close" aria-label="关闭">×</button>
      </header>
      <div class="modal-preview__body">
        <label class="field">
          <span>提交说明（可选）</span>
          <input type="text" id="publish-message" placeholder="例如：新增 2026 年论文" />
        </label>
        <label class="field">
          <span>管理员密码</span>
          <input type="password" id="publish-password" placeholder="输入管理密码以授权发布" autocomplete="off" />
        </label>
        <p class="form-note">发布会把当前所有内容写入仓库数据文件，并推送到 GitHub main 分支，触发 Vercel 自动部署到正式域名。</p>
        <p class="form-error" id="publish-error" hidden></p>
        <p class="form-ok" id="publish-ok" hidden></p>
        <button class="btn btn--primary btn--block" id="publish-confirm">确认发布</button>
      </div>
    </div>
  </div>

  <!-- ============ 轻提示 ============ -->
  <div class="toast" id="toast" hidden></div>

  <script src="data/projects.js"></script>
  <script src="admin/admin.js"></script>
</body>
</html>
